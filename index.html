<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151D" media="(prefers-color-scheme: dark)">
<meta name="description" content="منصة شخصية لحفظ القرآن، حوكمة المالية، تعلم الإنجليزية، والأهداف">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مستهدفاتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مستهدفاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-column phone app, scrolling content + fixed bottom tab bar; sheets slide up from the bottom */
:root{
  --bg:#F6F2E8; --surface:#FFFDF8; --ink:#1E2430; --muted:#6B6658; --line:#E4DCC8;
  --gold:#A8842C; --gold-soft:#F1E6C8;
  --p:#4F7A5A; --f:#A8842C; --c:#2F4A72;
  --ok:#3F7D58; --warn:#B7791F; --late:#B4443A;
  --a1:#A8842C; --a2:#4F7A5A; --a3:#2F4A72; --a4:#8A5A7A; --a5:#C2703D; --a6:#6B8F9E; --a7:#7A7466;
  --shade:rgba(20,22,28,.45);
  --display:"Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --surface:#18202B; --ink:#ECE6D8; --muted:#9A9484; --line:#2A3340;
  --gold:#D4AF5A; --gold-soft:#332C1C; --p:#7FB08A; --f:#D4AF5A; --c:#86A6D6;
  --ok:#6FB98A; --warn:#E0A64A; --late:#E07A6E;
  --a1:#D4AF5A; --a2:#7FB08A; --a3:#86A6D6; --a4:#C08FB0; --a5:#E09A68; --a6:#8FB6C4; --a7:#A8A292;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#18202B; --ink:#ECE6D8; --muted:#9A9484; --line:#2A3340;
  --gold:#D4AF5A; --gold-soft:#332C1C; --p:#7FB08A; --f:#D4AF5A; --c:#86A6D6;
  --ok:#6FB98A; --warn:#E0A64A; --late:#E07A6E;
  --a1:#D4AF5A; --a2:#7FB08A; --a3:#86A6D6; --a4:#C08FB0; --a5:#E09A68; --a6:#8FB6C4; --a7:#A8A292;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:500}
.sm{font-size:12.5px}

header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
header.top h1{font-family:var(--display);font-size:28px;line-height:1.2}
.date{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--gold);font-weight:600;font-size:13px;padding:0 0 2px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-top:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--late)}

.banner{background:var(--gold-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.banner button{background:none;border:1px solid var(--gold);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.frame{border:3px double var(--gold);border-radius:18px;padding:18px}
.hero{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font-size:24px;line-height:1}
.ring .v span{font-size:10.5px;color:var(--muted)}
.hero-txt{min-width:0;display:grid;gap:6px}
.hero-txt h2{font-family:var(--display);font-size:21px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.stats b{font-size:16px}

section{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sec-h h3{font-size:16px;font-weight:700}
.link{background:none;border:0;color:var(--gold);font-weight:600;font-size:13px;padding:4px}

.today{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%}
.mod .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-content:center;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.mod .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.mod .tx{flex:1;min-width:0;display:grid;gap:2px}
.mod .tx b{font-size:14.5px;overflow-wrap:anywhere}
.mod .tx span{font-size:12.5px;color:var(--muted)}
.mod .go{color:var(--muted);font-size:18px}

.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:grid;gap:8px;min-width:0}
.pill-card .nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--k)}
.pc-p{--k:var(--p)} .pc-f{--k:var(--f)} .pc-c{--k:var(--c)}
.pill-card b{font-size:22px;line-height:1}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--k,var(--gold));border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--late)}
.pill-card small{color:var(--muted);font-size:11px}

.list{display:grid;gap:10px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:9px;text-align:start;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.goal h4{font-size:15.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.late{color:var(--late)} .st.done{color:var(--gold)} .st.mute{color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tasks{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:none;display:grid;place-content:center;padding:0}
.check[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.check[aria-checked="true"]::after{content:"";width:10px;height:6px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{color:var(--muted)}
.task.done .t>span:first-child{text-decoration:line-through}
.sub{display:block;font-size:11.5px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:13px}
.quick{display:flex;gap:8px;margin-top:10px}
.quick input{flex:1;min-width:0}

input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--late);border:1px solid var(--late)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.wide{width:100%}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 11px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--gold);font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}

.sheet{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .panel{animation:none}}
.panel h2{font-family:var(--display);font-size:22px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto -4px}
.field{display:grid;gap:6px;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;font-size:13px;display:flex;justify-content:center;align-items:center;gap:6px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--ink);background:var(--bg);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--gold)}
.days{grid-auto-flow:row;grid-template-columns:repeat(7,1fr)}
.days label{font-size:11.5px;padding:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;align-items:center}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.big{font-size:30px;font-weight:700;line-height:1.15}
.big small{font-size:14px;font-weight:500;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.err{color:var(--late);font-size:12.5px;margin:0}
.steps{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.steps .task{padding:10px 12px}
.loading{padding:50px 10px;text-align:center;color:var(--muted)}

/* Quran */
.portion{display:grid;gap:4px}
.portion .pg{font-family:var(--display);font-size:24px;line-height:1.3}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .t{flex:1;min-width:0}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.strip i{aspect-ratio:1;border-radius:4px;background:var(--line);max-width:100%}
.strip i.full{background:var(--p)} .strip i.half{background:color-mix(in srgb,var(--p) 40%,var(--line))} .strip i.off{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Finance */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:grid;gap:2px;min-width:0}
.kpi b{font-size:16px;overflow-wrap:anywhere}
.kpi span{font-size:11.5px;color:var(--muted)}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.alloc i{display:block;height:100%}
.pos{color:var(--ok)} .neg{color:var(--late)}

/* English */
.flash{text-align:center;padding:26px 16px;display:grid;gap:12px}
.flash .w{font-size:32px;font-weight:700;direction:ltr;font-family:Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
.flash .m{font-size:20px;font-weight:600}
.flash .ex{direction:ltr;font-size:14px;color:var(--muted);font-style:italic}
.boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.boxes div{display:grid;gap:3px;justify-items:center;font-size:10.5px;color:var(--muted);height:100%;align-content:end}
.boxes i{width:100%;border-radius:5px 5px 0 0;background:var(--c);min-height:3px;display:block}
.ltr{direction:ltr;unicode-bidi:isolate}
.catrow{display:grid;grid-template-columns:1fr 92px auto;grid-template-areas:"n n n" "t p x";gap:6px 8px;padding:10px;border:1px solid var(--line);border-radius:12px}
.catrow .c-n{grid-area:n}.catrow .c-t{grid-area:t}.catrow .c-p{grid-area:p}.catrow .x{grid-area:x}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.checkline input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold);flex:none}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start;font-size:13.5px}
.alert:first-child{border-top:0}
.alert i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.alert.late i{background:var(--late)}.alert.warn i{background:var(--warn)}.alert.info i{background:var(--c)}
.alert span{flex:1;min-width:0}
.pillar{display:grid;gap:7px}
.rem{width:100%;min-height:96px;font-size:13.5px}
.rules{display:grid;gap:0}
.rules .task{padding:10px 0}
.gear{background:none;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;display:grid;place-content:center;color:var(--muted);padding:0;flex:none}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.toprt{display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60}
.say{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;justify-self:center}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"><div class="loading">جاري تحميل مستهدفاتك…</div></div>
<nav class="tabs" dir="rtl" lang="ar" aria-label="التنقل">
  <div class="in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button data-tab="quran"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5zM12 6v14"/></svg>القرآن</button>
    <button data-tab="finance"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>المالية</button>
    <button data-tab="english"><svg viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c0 3-2 6-6 8M13 20l4-9 4 9M14.5 17h5"/></svg>الإنجليزية</button>
    <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/></svg>الأهداف</button>
  </div>
</nav>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" dir="rtl" lang="ar"></div></div>

<script>
(function(){
/* ================= constants ================= */
const P={personal:{n:'شخصي',k:'p'},finance:{n:'مالي',k:'f'},career:{n:'مهني',k:'c'}};
const LS='mustahdafati-v1';
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* ================= goals logic ================= */
function prog(g){
  if(g.kind==='steps'){const n=g.steps.length;return n?g.steps.filter(s=>s.done).length/n:0}
  const span=(+g.target)-(+g.start);if(!span)return(+g.current)>=(+g.target)?1:0;
  return clamp(((+g.current)-(+g.start))/span);
}
function status(g){
  const p=prog(g);if(p>=1)return['done','مكتمل'];if(!g.due)return['ok','قيد التنفيذ'];
  const s=new Date(g.created).getTime(),e=new Date(g.due+'T23:59:59').getTime(),n=Date.now();
  if(n>e)return['late','تجاوز الموعد'];
  const exp=e>s?clamp((n-s)/(e-s)):0;return p+0.08>=exp?['ok','على المسار']:['warn','يحتاج دفعة'];
}
function daysLeft(g){if(!g.due)return'بدون موعد';const d=diffDays(today(),g.due);if(d<0)return'انتهى قبل '+fmt(-d)+' يوم';if(d===0)return'ينتهي اليوم';return'باقي '+fmt(d)+' يوم'}
const avg=l=>l.length?l.reduce((a,g)=>a+prog(g),0)/l.length:0;
const goalById=id=>state.goals.find(g=>g.id===id);
function amount(g){return g.kind==='steps'?`${fmt(g.steps.filter(s=>s.done).length)} من ${fmt(g.steps.length)} مراحل`:`${fmt(g.current)} / ${fmt(g.target)} ${esc(g.unit||'')}`}

/* ================= quran logic ================= */
const lastPage=s=>s===114?604:Math.max(SP[s-1],SP[s]-1);
function surahsOn(p){const a=[];for(let i=0;i<114;i++)if(SP[i]===p)a.push(SN[i]);if(!a.length){for(let i=113;i>=0;i--)if(SP[i]<=p){a.push(SN[i]);break}}return a}
let unitCache={key:'',u:[]};
function units(q){
  const key=[q.start,q.end,q.rate].join('|');if(unitCache.key===key)return unitCache.u;
  const asc=q.start<=q.end, pages=[];
  if(asc){for(let p=SP[q.start-1];p<=lastPage(q.end);p++)pages.push(p)}else{for(let p=lastPage(q.start);p>=SP[q.end-1];p--)pages.push(p)}
  const u=[];
  if(q.rate>=1){for(let i=0;i<pages.length;i+=q.rate)u.push({pages:pages.slice(i,i+q.rate),part:null})}
  else{const k=Math.round(1/q.rate);pages.forEach(p=>{for(let j=0;j<k;j++)u.push({pages:[p],part:[asc?j+1:k-j,k]})})}
  unitCache={key,u};return u;
}
const PART={2:['النصف الأول','النصف الثاني'],4:['الربع الأول','الربع الثاني','الربع الثالث','الربع الأخير']};
function uPages(u){return u.part?1/u.part[1]:u.pages.length}
function uTitle(u){const p=u.pages;const pg=p.length>1?`صفحة ${fmt(Math.min(...p))}–${fmt(Math.max(...p))}`:`صفحة ${fmt(p[0])}`;return u.part?pg+' · '+PART[u.part[1]][u.part[0]-1]:pg}
function uSurah(u){return[...new Set(u.pages.flatMap(surahsOn))].join('، ')}
function rangeTitle(list){if(!list.length)return'';const ps=[...new Set(list.flatMap(u=>u.pages))];const a=Math.min(...ps),b=Math.max(...ps);return a===b?`صفحة ${fmt(a)}`:`الصفحات ${fmt(a)}–${fmt(b)}`}
function qInfo(){
  const q=state.quran;if(!q)return null;const U=units(q),t=today(),lg=q.log[t]||{};
  const base=lg.n?lg.u:q.done;const cur=lg.n?U[lg.u]:U[q.done];
  const near=U.slice(Math.max(0,base-5),base);
  const oldPages=[...new Set(U.slice(0,Math.max(0,base-5)).flatMap(u=>u.pages))];
  let far=[];if(oldPages.length){const ch=Math.min(q.far||2,oldPages.length),n=Math.max(0,diffDays(q.startDate,t)),off=(n*ch)%oldPages.length;for(let i=0;i<ch;i++)far.push(oldPages[(off+i)%oldPages.length])}
  const studyDay=q.days.includes(new Date().getDay());
  const total=U.reduce((a,u)=>a+uPages(u),0), doneP=U.slice(0,q.done).reduce((a,u)=>a+uPages(u),0);
  return{q,U,lg,cur,near,far,studyDay,total,doneP,finished:q.done>=U.length};
}
function qProject(q,U){
  let rem=U.length-q.done;if(rem<=0)return null;let d=today();const lg=q.log[d]||{};
  if(lg.n||!q.days.includes(D(d).getDay()))d=addDays(d,1);
  const dates=[];let guard=0;
  while(rem>0&&guard<4000){if(q.days.includes(D(d).getDay())){dates.push(d);rem--}d=addDays(d,1);guard++}
  return dates;
}

function finAlerts(){

function spark(vals,color){
  if(vals.length<2)return'';
  const mn=Math.min(...vals),mx=Math.max(...vals),W=300,H=56,pad=6;
  const pts=vals.map((v,i)=>[pad+i*(W-2*pad)/(vals.length-1),H-pad-(mx===mn?.5:(v-mn)/(mx-mn))*(H-2*pad)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="transform:scaleX(-1)"><path d="${d} L${l[0]} ${H} L${pad} ${H}Z" fill="color-mix(in srgb,var(${color||'--gold'}) 18%,transparent)"/><path d="${d}" fill="none" stroke="var(${color||'--gold'})" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="var(${color||'--gold'})"/></svg>`;
}

function commit(){persist();render();if(openKind==='goal'&&openId)goalSheet(openId);else if(openKind==='debt'&&openId)debtSheet(openId);else if(openKind==='close')closeSheetView()}
function done(){closeSheet();persist();render()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.tab){session=null;tab=b.dataset.tab;closeSheet();render();return}
  const a=b.dataset.act,id=b.dataset.id,f=state.fin;
  switch(a){
    case'close':return closeSheet();
    case'settings':return settingsSheet();
    case'backup':doBackup(b);return;
    case'copy-bk':{const ta=panel.querySelector('#bk-txt');try{navigator.clipboard.writeText(ta.value).then(()=>{b.textContent='تم النسخ'},()=>{ta.focus();ta.select()})}catch(e){ta.focus();ta.select()}return}
    case'new-goal':return goalForm();
    case'new-task':return taskForm();
    case'open-goal':return goalSheet(id);
    case'filter':filter=b.dataset.p;return render();
    case'pillar':filter=b.dataset.p;tab='goals';return render();
    case'clear-sample':state.goals=state.goals.filter(g=>!g.sample);state.tasks=state.tasks.filter(t=>!t.sample&&!(t.goalId&&!goalById(t.goalId)));persist();render();if(openKind==='settings')settingsSheet();return;
    case'toggle-task':{const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;commit()}return}
    case'del-task':state.tasks=state.tasks.filter(x=>x.id!==id);return commit();
    /* quran */
    case'q-setup':return qForm();
    case'q-reset':if(!delArm){delArm=true;b.textContent='اضغط مرة ثانية للتأكيد';return}state.quran=null;return done();
    case'q-new':{const q=state.quran,t=today(),lg=q.log[t]||(q.log[t]={});const U=units(q);
      if(!lg.n&&q.done<U.length){lg.n=true;lg.u=q.done;q.done++}else if(lg.n&&lg.u===q.done-1){lg.n=false;delete lg.u;q.done--}
      return commit()}
    case'q-near':case'q-far':{const q=state.quran,lg=q.log[today()]||(q.log[today()]={}),k=a==='q-near'?'r':'f';lg[k]=!lg[k];return commit()}
    /* finance */
    case'fsub':fsub=b.dataset.k;return render();
    case'go-fin':if(b.dataset.k==='backup')return settingsSheet();tab='finance';fsub=b.dataset.k||'gov';closeSheet();return render();
    case'dview':dview=b.dataset.k;return render();
    case'f-rules':return rulesForm();
    case'f-close':return closeSheetView();
    case'close-item':{const cl=f.closes[cycle().s];cl.items[b.dataset.k]=!cl.items[b.dataset.k];return commit()}
    case'close-done':{const cl=f.closes[cycle().s],ni=panel.querySelector('#cl-note');if(ni)cl.note=ni.value.trim();cl.done=today();cl.score=health().score;snap();return done()}
    case'debt-doc':{const x=f.debts.find(d=>d.id===openId);if(x){x.doc=!x.doc;commit()}return}
    case'copy-rem':{const ta=panel.querySelector('#rem');const ok=()=>{b.textContent='تم النسخ'};try{navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.focus();ta.select()})}catch(e){ta.focus();ta.select()}return}
    case'f-cats':return catsForm();
    case'c-add':{const w=document.createElement('div');w.innerHTML=catRow({id:uid(),n:'',pct:0});panel.querySelector('#c-rows').appendChild(w.firstChild);catSum();return}
    case'c-del':b.closest('[data-cid]').remove();return catSum();
    case'del-exp':f.exp=f.exp.filter(x=>x.id!==id);return commit();
    case'f-add-fixed':return fixedForm();
    case'pay-fixed':{const x=f.fixed.find(z=>z.id===id),c=cycle();if(!x)return;x.paid=(x.paid||[]).filter(p=>p>=addDays(c.s,-400));x.paid.push(c.s);f.exp.push({id:uid(),d:today(),amt:+x.amt,cat:x.cat,note:x.n,fixed:x.id});return commit()}
    case'del-fixed':f.fixed=f.fixed.filter(x=>x.id!==id);return commit();
    case'f-add-debt':return debtForm(b.dataset.k);
    case'open-debt':return debtSheet(id);
    case'del-debt':if(!delArm){delArm=true;return debtSheet(openId)}f.debts=f.debts.filter(x=>x.id!==openId);snap();return done();
    case'f-add-asset':return assetForm();
    case'open-asset':return assetForm(id);
    case'del-asset':if(!delArm){delArm=true;b.textContent='اضغط مرة ثانية';return}f.assets=f.assets.filter(x=>x.id!==openId);snap();return done();
    case'f-add-loan':return loanForm();
    case'open-loan':return loanForm(id);
    case'del-loan':if(!delArm){delArm=true;b.textContent='اضغط مرة ثانية';return}f.loans=f.loans.filter(x=>x.id!==openId);snap();return done();
    /* english */
    case'en-start':startSession();return render();
    case'en-show':session.shown=true;return render();
    case'en-ok':grade(true);return render();
    case'en-bad':grade(false);return render();
    case'en-end':session.i=session.list.length;return render();
    case'en-min':{const lg=enLog();lg.min=!lg.min;return commit()}
    case'en-add':return enForm();
    case'en-set':return enSet();
    case'say':return speak(b.dataset.t);
    case'en-del':state.en.words=state.en.words.filter(w=>w.id!==id);return commit();
    case'en-starter':{const have=new Set(state.en.words.map(w=>w.w.toLowerCase()));STARTER.forEach(([w,m,ex])=>{if(!have.has(w))state.en.words.push({id:uid(),w,m,ex,box:-1,due:'',added:today()})});return commit()}
  }
  const g=openKind==='goal'&&goalById(openId);
  if(a==='toggle-step'&&g){const s=g.steps.find(x=>x.id===id);if(s){s.done=!s.done;commit()}return}
  if(a==='del-step'&&g){g.steps=g.steps.filter(x=>x.id!==id);return commit()}
  if(a==='del-goal'&&g){if(!delArm){delArm=true;return goalSheet(g.id)}state.goals=state.goals.filter(x=>x.id!==g.id);state.tasks.forEach(t=>{if(t.goalId===g.id)t.goalId=null});return done()}
});
document.addEventListener('submit',e=>{
  const fm=e.target.closest('[data-form]');if(!fm)return;e.preventDefault();
  const v=s=>(fm.querySelector(s))?.value?.trim()||'';
  const err=(s,m)=>{const el=fm.querySelector(s);if(el){el.textContent=m;el.hidden=false}};
  const k=fm.dataset.form,f=state.fin;
  switch(k){
    case'quick-task':{const t=v('#qt');if(!t)return;state.tasks.push({id:uid(),t,date:today(),done:false,goalId:null});persist();render();app.querySelector('#qt')?.focus();return}
    case'task':{const t=v('#t-text');if(!t)return;state.tasks.push({id:uid(),t,date:v('#t-date')||today(),done:false,goalId:v('#t-goal')||null});return done()}
    case'goal':{
      const title=v('#g-title'),kind=fm.querySelector('input[name=kind]:checked').value;
      const g={id:uid(),title,pillar:fm.querySelector('input[name=pillar]:checked').value,kind,due:v('#g-due'),created:new Date().toISOString(),steps:[],history:[]};
      if(!title)return err('#g-err','اكتب اسم الهدف.');
      if(kind==='number'){const tg=num(v('#g-target')),st=num(v('#g-start'))||0,cu=num(v('#g-current'));if(!isFinite(tg)||tg===st)return err('#g-err','حدد رقم مستهدف مختلف عن نقطة البداية.');Object.assign(g,{target:tg,start:st,current:isFinite(cu)?cu:st,unit:v('#g-unit')});g.history=[{d:today(),v:g.current}]}
      else{g.steps=v('#g-steps').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),t,done:false}));if(!g.steps.length)return err('#g-err','أضف مرحلة واحدة على الأقل.')}
      state.goals.push(g);tab='goals';filter='all';return done()}
    case'quran':{
      const n=qRead();if(!n.days.length)return err('#q-err','اختر يوم واحد على الأقل للحفظ.');
      const o=state.quran;
      if(o&&o.start===n.start&&o.end===n.end&&o.rate===n.rate){o.days=n.days;o.far=n.far}
      else state.quran=Object.assign(n,{done:0,log:{},startDate:today()});
      return done()}
    case'salary':{const s=num(v('#s-sal'));if(!(s>0))return;f.salary=s;f.payday=Math.max(1,Math.min(31,parseInt(v('#s-day'))||27));persist();render();return catsForm()}
    case'cats':{
      const s=num(v('#c-sal'));if(!(s>0))return err('#c-err','اكتب صافي الراتب.');
      const rows=[...fm.querySelectorAll('[data-cid]')].map(r=>({id:r.dataset.cid,n:r.querySelector('.c-n').value.trim(),type:r.querySelector('.c-t').value,pct:num(r.querySelector('.c-p').value)||0})).filter(r=>r.n);
      const t=rows.reduce((a,r)=>a+r.pct,0);if(!rows.length)return err('#c-err','أضف بند واحد على الأقل.');
      if(Math.abs(t-100)>.01)return err('#c-err','مجموع النسب لازم يكون ١٠٠٪، الحين '+fmt(t)+'٪.');
      f.salary=s;f.payday=Math.max(1,Math.min(31,parseInt(v('#c-day'))||27));f.cats=rows;return done()}
    case'exp':{const a=num(v('#e-amt'));if(!(a>0))return;const ct=f.cats.find(c=>c.id===v('#e-cat'));
      if(ct&&ct.type==='want'&&a>=f.rules.buyWait&&fm.dataset.ok!==String(a)){fm.dataset.ok=String(a);return err('#e-err',`قاعدتك: أي شراء كمالي فوق ${sar(f.rules.buyWait)} تنتظر عليه ٤٨ ساعة. إذا قررت بعد التفكير، اضغط تسجيل مرة ثانية.`)}
      if(f.salary&&ct){const b=f.salary*ct.pct/100,s0=spentBy(ct.id);if(s0<=b&&s0+a>b&&fm.dataset.ok2!==String(a)){fm.dataset.ok2=String(a);return err('#e-err',`هذا المصروف يتجاوز حد بند ${ct.n} بـ ${sar(s0+a-b)}. اضغط تسجيل مرة ثانية للتأكيد.`)}}
      f.exp.push({id:uid(),d:v('#e-date')||today(),amt:a,cat:v('#e-cat'),note:v('#e-note')});persist();render();return}
    case'fixed':{const a=num(v('#x-a'));if(!(a>0)||!v('#x-n'))return;f.fixed.push({id:uid(),n:v('#x-n'),amt:a,day:Math.max(1,Math.min(31,parseInt(v('#x-d'))||1)),cat:v('#x-c'),until:v('#x-u'),paid:[]});return done()}
    case'debt':{
      const a=num(v('#d-amt')),who=v('#d-who'),dir=fm.querySelector('input[name=d-dir]:checked').value,reason=v('#d-reason'),R=f.rules;
      if(!(a>0)||!who)return err('#d-err','اكتب الاسم والمبلغ.');
      if(dir==='them'&&R.reason&&!reason)return err('#d-err','قاعدتك: ما تستدين إلا بسبب مكتوب.');
      if(dir==='me'&&worth().mine+a>R.lendMax&&!fm.dataset.ok){fm.dataset.ok='1';return err('#d-err',`بهذا المبلغ يصير إجمالي اللي لك عند الناس ${sar(worth().mine+a)}، وحدك ${sar(R.lendMax)}. اضغط حفظ مرة ثانية للتأكيد.`)}
      let sched=[],due=v('#d-due');
      if(fm.querySelector('input[name=d-mode]:checked').value==='inst'){const n=parseInt(v('#d-n')),first=v('#d-first')||addMonths(today(),1);if(!(n>=2))return err('#d-err','عدد الأقساط لازم يكون ٢ أو أكثر.');
        const per=Math.floor(a/n*100)/100;for(let i=0;i<n;i++)sched.push({due:addMonths(first,i),amt:i<n-1?per:Math.round((a-per*(n-1))*100)/100});due=sched[n-1].due}
      f.debts.push({id:uid(),dir,who,amt:a,paid:0,pays:[],due,sched,doc:fm.querySelector('#d-doc').checked,reason,on:today(),note:''});snap();return done()}
    case'debt-pay':{const x=f.debts.find(d=>d.id===openId),a=num(v('#dp'));if(!x||!(a>0))return;x.paid=Math.min(+x.amt,(+x.paid||0)+a);(x.pays=x.pays||[]).push({d:today(),a});snap();return commit()}
    case'asset':{const val=num(v('#a-v'));if(!isFinite(val)||!v('#a-n'))return;const a=openId&&f.assets.find(x=>x.id===openId);
      if(a)Object.assign(a,{n:v('#a-n'),type:v('#a-t'),val,upd:today()});else f.assets.push({id:uid(),n:v('#a-n'),type:v('#a-t'),val,upd:today()});snap();return done()}
    case'loan':{const bal=num(v('#l-b'));if(!isFinite(bal)||!v('#l-n'))return;const l=openId&&f.loans.find(x=>x.id===openId),m=num(v('#l-m'));
      if(l)Object.assign(l,{n:v('#l-n'),bal,monthly:isFinite(m)?m:0});else f.loans.push({id:uid(),n:v('#l-n'),bal,monthly:isFinite(m)?m:0});snap();return done()}
    case'en-add':{
      const add=[];const w=v('#w-w'),m=v('#w-m');if(w&&m)add.push([w,m,v('#w-ex')]);
      v('#w-bulk').split('\n').forEach(line=>{const p=line.split(/\s+[-–—:]\s+|\t/);if(p.length>=2&&p[0].trim()&&p[1].trim())add.push([p[0].trim(),p.slice(1).join(' - ').trim(),''])});
      if(!add.length)return err('#w-err','اكتب الكلمة ومعناها، أو أسطر بصيغة word - المعنى.');
      add.forEach(([w,m,ex])=>state.en.words.push({id:uid(),w,m,ex,box:-1,due:'',added:today()}));return done()}
    case'rules':{const g=(id,d)=>{const n=num(v(id));return isFinite(n)&&n>=0?n:d},R=f.rules;
      Object.assign(R,{buyWait:g('#r-buy',R.buyWait),commitMax:g('#r-com',R.commitMax),emergency:g('#r-em',R.emergency),lendMax:g('#r-lend',R.lendMax),payFirst:fm.querySelector('#r-pay').checked,reason:fm.querySelector('#r-rea').checked});return done()}
    case'en-set':{state.en.daily=+fm.querySelector('input[name=en-d]:checked').value;state.en.minutes=+fm.querySelector('input[name=en-m]:checked').value;return done()}
  }
  const g=openKind==='goal'&&goalById(openId);if(!g)return;
  if(k==='update-val'){const n=num(v('#u-val'));if(!isFinite(n))return;g.current=n;g.history=(g.history||[]).filter(h=>h.d!==today());g.history.push({d:today(),v:n});if(g.history.length>60)g.history=g.history.slice(-60);return commit()}
  if(k==='add-step'){const t=v('#s-new');if(!t)return;g.steps.push({id:uid(),t,done:false});return commit()}
  if(k==='goal-task'){const t=v('#gt-new');if(!t)return;state.tasks.push({id:uid(),t,date:today(),done:false,goalId:g.id});return commit()}
});
boot();
})();
</script>
